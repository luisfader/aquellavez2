name: Importar imágenes desde Figma
on:
  push:
    paths: ['tools/imagenes.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y optimizar
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y imagemagick webp >/dev/null
          mkdir -p img tmp
          while read -r nombre ancho url; do
            [ -z "$nombre" ] && continue
            [ -f "img/$nombre.jpg" ] && { echo "ya existe $nombre"; continue; }
            echo "→ $nombre"
            curl -sSfL -o "tmp/$nombre.png" "$url" || { echo "falló $nombre"; continue; }
            convert "tmp/$nombre.png" -resize "${ancho}x>" -strip -quality 84 "img/$nombre.jpg"
            cwebp -quiet -q 80 -resize "$ancho" 0 "tmp/$nombre.png" -o "img/$nombre.webp" || true
          done < tools/imagenes.txt
          ls -la img
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img
          git commit -m "Imágenes de la Unidad 1 importadas desde Figma" || echo "sin cambios"
          git push
